name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: MTZInstaller-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Publish APK to branch mtz-apk
        run: |
          mkdir out
          cp app/build/outputs/apk/release/*.apk out/MTZInstaller.apk
          cd out
          git init -q -b mtz-apk
          git add MTZInstaller.apk
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" \
            commit -qm "APK ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" mtz-apk
